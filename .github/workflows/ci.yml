# 표준 라이브러리 전용 검사 층만 돌린다 — 렌더 스모크, 한글 무결성, HWPX 구조 품질
# 검사기(S·F·C·P). 스킬 동봉 예시(example_differentiation.json)로 렌더해 매번 현재
# 렌더러를 검사한다. 한컴 COM 실열림·PDF 쪽 채움 실측은 한글이 필요해 CI에 들어올 수
# 없다 — 그 층은 로컬 품질 루프가 맡는다 (docs/hwpx-quality-loop.md).

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 특수교육 차별화 예시 렌더 + 한글 무결성
        run: |
          bash plugin/skills/sped-lesson-differentiation/scripts/render_all.sh \
            plugin/skills/sped-lesson-differentiation/references/example_differentiation.json \
            /tmp/sped-diff-example

      - name: HWPX 품질 검사기
        run: |
          python tests/check_hwpx_quality.py /tmp/sped-diff-example
